<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="chartA-title chartA-desc">
  <title id="chartA-title">Overall Accuracy Comparison — LongMemEval-S</title>
  <desc id="chartA-desc">Bar chart comparing 76.2% ExergyNet xLMP, 74.4% Oracle, and 56.4% BM25 on LongMemEval-S 500 questions.</desc>
  <defs>
    <linearGradient id="gA1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e887"/>
      <stop offset="1" stop-color="#00b868"/>
    </linearGradient>
    <linearGradient id="gA2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e9eff"/>
      <stop offset="1" stop-color="#2a7be8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="320" fill="#091525" rx="8"/>

  <!-- Title -->
  <text x="32" y="36" font-family="'Space Mono',monospace" font-size="10" fill="#7896b8" letter-spacing="0.1em" text-transform="uppercase">OVERALL ACCURACY · LONGMEMEVAL-S · 500 QUESTIONS</text>

  <!-- Y-axis labels -->
  <text x="28" y="80" font-family="'Space Mono',monospace" font-size="10" fill="#3a5070" text-anchor="end">100%</text>
  <text x="28" y="130" font-family="'Space Mono',monospace" font-size="10" fill="#3a5070" text-anchor="end">75%</text>
  <text x="28" y="180" font-family="'Space Mono',monospace" font-size="10" fill="#3a5070" text-anchor="end">50%</text>
  <text x="28" y="230" font-family="'Space Mono',monospace" font-size="10" fill="#3a5070" text-anchor="end">25%</text>
  <text x="28" y="280" font-family="'Space Mono',monospace" font-size="10" fill="#3a5070" text-anchor="end">0%</text>

  <!-- Grid lines -->
  <line x1="36" y1="77" x2="610" y2="77" stroke="#0b1a2e" stroke-width="1"/>
  <line x1="36" y1="127" x2="610" y2="127" stroke="#0b1a2e" stroke-width="1"/>
  <line x1="36" y1="177" x2="610" y2="177" stroke="#0b1a2e" stroke-width="1"/>
  <line x1="36" y1="227" x2="610" y2="227" stroke="#0b1a2e" stroke-width="1"/>
  <line x1="36" y1="277" x2="610" y2="277" stroke="rgba(60,140,220,0.18)" stroke-width="1"/>

  <!-- Bar: BM25 (56.4%) — gray, left -->
  <!-- bar height = 56.4% * 200px = 112.8px, bottom = 277, top = 277-112.8 = 164.2 -->
  <rect x="100" y="164" width="110" height="113" fill="rgba(78,158,255,0.25)" rx="4" stroke="rgba(78,158,255,0.4)" stroke-width="1"/>
  <text x="155" y="156" font-family="'Barlow Condensed','Barlow',sans-serif" font-size="22" font-weight="900" fill="#4e9eff" text-anchor="middle">56.4%</text>
  <text x="155" y="300" font-family="'Space Mono',monospace" font-size="9" fill="#7896b8" text-anchor="middle">BM25 RAG</text>
  <text x="155" y="312" font-family="'Space Mono',monospace" font-size="9" fill="#3a5070" text-anchor="middle">Baseline</text>

  <!-- Bar: Oracle (74.4%) — blue -->
  <!-- bar height = 74.4% * 200 = 148.8, top = 277-148.8 = 128.2 -->
  <rect x="265" y="128" width="110" height="149" fill="url(#gA2)" opacity="0.5" rx="4" stroke="#4e9eff" stroke-width="1"/>
  <text x="320" y="120" font-family="'Barlow Condensed','Barlow',sans-serif" font-size="22" font-weight="900" fill="#4e9eff" text-anchor="middle">74.4%</text>
  <text x="320" y="300" font-family="'Space Mono',monospace" font-size="9" fill="#7896b8" text-anchor="middle">Oracle</text>
  <text x="320" y="312" font-family="'Space Mono',monospace" font-size="9" fill="#3a5070" text-anchor="middle">Ceiling</text>

  <!-- Bar: xLMP (76.2%) — green accent -->
  <!-- bar height = 76.2% * 200 = 152.4, top = 277-152.4 = 124.6 -->
  <rect x="430" y="125" width="110" height="152" fill="url(#gA1)" opacity="0.75" rx="4" stroke="#00e887" stroke-width="1.5"/>
  <text x="485" y="117" font-family="'Barlow Condensed','Barlow',sans-serif" font-size="22" font-weight="900" fill="#00e887" text-anchor="middle">76.2%</text>
  <text x="485" y="300" font-family="'Space Mono',monospace" font-size="9" fill="#ddeeff" text-anchor="middle">ExergyNet</text>
  <text x="485" y="312" font-family="'Space Mono',monospace" font-size="9" fill="#7896b8" text-anchor="middle">xLMP</text>

  <!-- p=0.474 annotation between Oracle and xLMP -->
  <line x1="375" y1="127" x2="430" y2="124" stroke="rgba(0,232,135,0.3)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="402" y="118" font-family="'Space Mono',monospace" font-size="8" fill="#3a5070" text-anchor="middle">p=0.474</text>
  <text x="402" y="128" font-family="'Space Mono',monospace" font-size="8" fill="#3a5070" text-anchor="middle">n.s.</text>
</svg>
